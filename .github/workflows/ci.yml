name: CI

# Clippy and the tests on pull requests and on every branch push. Tags are not built here (release.yml
# does that), and nothing is packaged or published by this workflow.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      # Edition 2024 needs a current Rust; the runner image ships rustup with a stable toolchain
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # Home, config, data, state, cache and runtime folders are fresh and empty, and there is no display, so
      # nothing of the runner (or a clipboard, or a running instance) is touched. Cargo and rustup keep their homes.
      - name: Tests
        run: |
          iso="$(mktemp -d)"
          mkdir -p "$iso"/{home,config,data,state,cache,runtime}
          chmod 700 "$iso/runtime"
          env -u DISPLAY -u WAYLAND_DISPLAY \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            HOME="$iso/home" XDG_CONFIG_HOME="$iso/config" XDG_DATA_HOME="$iso/data" \
            XDG_STATE_HOME="$iso/state" XDG_CACHE_HOME="$iso/cache" XDG_RUNTIME_DIR="$iso/runtime" \
            cargo test --locked
