name: CI

# Clippy on pull requests and on every branch push. Tags are not built here (release.yml
# does that), and nothing is packaged or published by this workflow.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      # Edition 2024 needs a current Rust; the runner image ships rustup with a stable toolchain
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
