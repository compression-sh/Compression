name: Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, so that a release tag can be compared with the others
          fetch-depth: 0
      # `latest` moves only for the highest release: a tag for an older line (a fix for 0.5 after 0.6 was released)
      # publishes its version and leaves `latest` where it is. A pre-release tag is never the highest release.
      - id: newest
        run: |
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$newest" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=auto" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/compression
          # `latest` only for the highest release tag (never a pre-release such as v1.2.3-rc.1); a push to master is `edge`
          flavor: |
            latest=${{ steps.newest.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=edge,branch=master
      - uses: docker/build-push-action@v7
        with:
          context: .
          # A release tag and master publish; a manual run from any other branch only builds
          push: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
