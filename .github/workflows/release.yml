name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # The oldest runner image, so the binary runs on any distribution with a glibc at least as old
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $version"; exit 1; }

      - run: cargo build --release --locked

      - run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          strip target/release/compression
          packaging/stage.sh target/stage
          mkdir -p dist
          tar -C target/stage -czf "dist/compression-${version}-x86_64-linux.tar.gz" usr
          cargo deb --no-build --no-strip -o "dist/compression_${version}_amd64.deb"
          cargo generate-rpm -o "dist/compression-${version}-1.x86_64.rpm"
          (cd dist && sha256sum * > SHA256SUMS)

      # Install the packages next to Nautilus in clean containers, so a file clash or an unmet dependency
      # stops the release before anything is uploaded
      - name: Smoke-test the packages
        run: packaging/smoke.sh dist

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true

      # nix/bin.nix installs this release's binary, so NixOS users don't compile Compression. Its hash is only
      # known now, after the build, so it goes into a commit on master after the tagged one.
      - name: Point the Nix package at this release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          hash="sha256-$(openssl dgst -sha256 -binary "dist/compression-${version}-x86_64-linux.tar.gz" | base64)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub now and then answers a push with an Internal Server Error for a few seconds: wait and try again.
          # Every attempt starts from the current master, so a commit that master gained meanwhile (even to
          # nix/release.json) can never leave a half-done rebase behind.
          for attempt in 1 2 3 4 5; do
            [ "$attempt" -gt 1 ] && sleep $(((attempt - 1) * 15))
            git fetch origin master && git checkout -q -B master origin/master || continue
            printf '{\n  "version": "%s",\n  "hash": "%s"\n}\n' "$version" "$hash" > nix/release.json
            git diff --quiet && exit 0
            git commit -qam "chore: Nix package installs the v${version} release binary"
            git push origin master && exit 0
          done
          echo "::error::could not push the Nix release commit after 5 attempts"
          exit 1
