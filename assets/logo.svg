<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Compression</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="1" stop-color="#122A3F"/>
    </linearGradient>

    <!-- Two converging compression blocks -->
    <g id="compressMark">
      <path d="M148 208 L228 208 L196 252 L116 252 Z"/>
      <path d="M284 208 L364 208 L396 252 L316 252 Z"/>
      <path d="M228 208 L284 208 L256 252 Z" opacity=".55"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Main mark -->
  <g fill="#E6F2FB" stroke="#E6F2FB" stroke-width="8"
     stroke-linejoin="round" transform="translate(-4 -22)">
    <use href="#compressMark"/>
    <use href="#compressMark" x="34" y="92"/>
  </g>

  <!-- Subtle motion / data lines -->
  <g stroke="#E6F2FB" stroke-width="8" stroke-linecap="round" opacity=".35">
    <path d="M58 218H92"/>
    <path d="M74 292H118"/>
    <path d="M96 322H132"/>
    <path d="M396 218H430"/>
    <path d="M382 292H420"/>
  </g>

  <!-- Small archive dot accent -->
  <circle cx="256" cy="386" r="12" fill="#E6F2FB" opacity=".75"/>
</svg>
