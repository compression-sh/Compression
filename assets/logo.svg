<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Compression</title>
  <rect width="512" height="512" fill="#0B1626"/>

  <!-- Datei -->
  <g fill="#E6F2FB" stroke="#E6F2FB" stroke-width="8" stroke-linejoin="round">
    <path d="M186 166H278L326 214V346H186Z"/>
    <path d="M294 166L326 198H294Z"/>
  </g>

  <!-- Reißverschluss (Zip) -->
  <g fill="#0B1626">
    <rect x="240" y="184" width="16" height="8" rx="2"/>
    <rect x="256" y="196" width="16" height="8" rx="2"/>
    <rect x="240" y="208" width="16" height="8" rx="2"/>
    <rect x="256" y="220" width="16" height="8" rx="2"/>
    <rect x="240" y="232" width="16" height="8" rx="2"/>
    <rect x="256" y="244" width="16" height="8" rx="2"/>
    <rect x="240" y="256" width="16" height="8" rx="2"/>
    <rect x="256" y="268" width="16" height="8" rx="2"/>
    <rect x="240" y="282" width="32" height="42" rx="6"/>
  </g>
  <rect x="250" y="302" width="12" height="12" rx="3" fill="#E6F2FB"/>

  <!-- Kompressions-Pfeile -->
  <g fill="none" stroke="#E6F2FB" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216 92L256 124L296 92"/>
    <path d="M216 420L256 388L296 420"/>
  </g>

  <!-- Bewegungslinien -->
  <g stroke="#E6F2FB" stroke-width="8" stroke-linecap="round" opacity=".4">
    <path d="M96 230H144"/>
    <path d="M116 256H156"/>
    <path d="M96 282H144"/>
    <path d="M368 230H416"/>
    <path d="M356 256H396"/>
    <path d="M368 282H416"/>
  </g>
</svg>
